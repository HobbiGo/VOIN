<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IoT Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, query, limitToLast } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // KONFIGURASI FIREBASE (SUDAH DISESUAIKAN)
        const firebaseConfig = {
            apiKey: "AIzaSyDFY21FPt8OoyYKtmnZ-Z9vq4By8WduqGc",
            authDomain: "voin-coin-ad692.firebaseapp.com",
            projectId: "voin-coin-ad692",
            storageBucket: "voin-coin-ad692.firebasestorage.app",
            messagingSenderId: "220942707813",
            appId: "1:220942707813:web:d76d6a9af2335a5c9bea8c",
            measurementId: "G-90VH123WF3",
            databaseURL: "https://voin-coin-ad692-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let chart, tempHistory = [], humidHistory = [], timeLabels = [];
        let currentUser = null;

        // Proteksi halaman
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUser = user;
            document.getElementById('userEmail').textContent = user.email;
            initRealtime();
            initChart();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "index.html";
        });

        // Inisialisasi grafik
        function initChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [
                        {
                            label: 'Suhu (°C)',
                            data: tempHistory,
                            borderColor: 'rgb(239, 68, 68)',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 2
                        },
                        {
                            label: 'Kelembaban (%)',
                            data: humidHistory,
                            borderColor: 'rgb(59, 130, 246)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: false, grid: { color: '#e5e7eb' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Realtime listener Firebase
        function initRealtime() {
            const sensorRef = query(ref(db, 'sensor'), limitToLast(1));

            onValue(sensorRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const key = Object.keys(data)[0];
                const val = data[key];
                const suhu = parseFloat(val.suhu) || 0;
                const kelembaban = parseFloat(val.kelembaban) || 0;

                // Update UI angka
                document.getElementById('suhu').textContent = suhu.toFixed(1);
                document.getElementById('kelembaban').textContent = kelembaban.toFixed(1);
                document.getElementById('updateTime').textContent = 
                    new Date().toLocaleTimeString('id-ID');

                // Status badge
                const statusEl = document.getElementById('status');
                if (suhu > 35 || kelembaban > 80) {
                    statusEl.textContent = '⚠️ Waspada';
                    statusEl.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-700';
                } else if (suhu > 30 || kelembaban > 70) {
                    statusEl.textContent = '⚡ Normal Tinggi';
                    statusEl.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-700';
                } else {
                    statusEl.textContent = '✅ Normal';
                    statusEl.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-700';
                }

                // Push ke chart
                const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                timeLabels.push(now);
                tempHistory.push(suhu);
                humidHistory.push(kelembaban);

                if (timeLabels.length > 20) {
                    timeLabels.shift();
                    tempHistory.shift();
                    humidHistory.shift();
                }
                if (chart) chart.update('none');
            });
        }

        // Ambil riwayat data
        function loadHistory() {
            const historyRef = query(ref(db, 'sensor'), limitToLast(50));
            onValue(historyRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                const rows = Object.entries(data).reverse().slice(0, 20);
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';
                rows.forEach(([key, val]) => {
                    const tgl = val.timestamp ? new Date(val.timestamp).toLocaleString('id-ID') : '-';
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="py-2 px-3 text-sm text-gray-600">${tgl}</td>
                            <td class="py-2 px-3 text-sm font-medium text-red-600">${parseFloat(val.suhu).toFixed(1)} °C</td>
                            <td class="py-2 px-3 text-sm font-medium text-blue-600">${parseFloat(val.kelembaban).toFixed(1)} %</td>
                        </tr>`;
                });
            });
        }
        loadHistory();
    </script>
</head>
<body class="min-h-screen bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                <h1 class="text-xl font-bold">IoT Monitoring Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="userEmail" class="text-sm text-blue-100 hidden sm:inline"></span>
                <button id="logoutBtn"
                    class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Status -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Monitoring Realtime</h2>
                <p class="text-gray-500 text-sm">Update terakhir: <span id="updateTime">-</span></p>
            </div>
            <span id="status" class="px-3 py-1 rounded-full text-sm font-semibold bg-gray-100 text-gray-600">
                Menunggu data...
            </span>
        </div>

        <!-- Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Suhu -->
            <div class="bg-white rounded-2xl shadow-lg p-6 border-l-4 border-red-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Suhu</p>
                        <p class="text-4xl font-bold text-gray-800 mt-2">
                            <span id="suhu">--</span>
                            <span class="text-xl text-gray-400">°C</span>
                        </p>
                    </div>
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center">
                        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zM9 19V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Kelembaban -->
            <div class="bg-white rounded-2xl shadow-lg p-6 border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Kelembaban</p>
                        <p class="text-4xl font-bold text-gray-800 mt-2">
                            <span id="kelembaban">--</span>
                            <span class="text-xl text-gray-400">%</span>
                        </p>
                    </div>
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Grafik Realtime</h3>
            <div style="height: 320px;">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <!-- Riwayat -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Riwayat Data (20 Terakhir)</h3>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50 text-left">
                            <th class="py-3 px-3 text-sm font-semibold text-gray-600">Waktu</th>
                            <th class="py-3 px-3 text-sm font-semibold text-gray-600">Suhu</th>
                            <th class="py-3 px-3 text-sm font-semibold text-gray-600">Kelembaban</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr>
                            <td colspan="3" class="py-6 text-center text-gray-400 text-sm">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
