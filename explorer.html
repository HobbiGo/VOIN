<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIN Block Explorer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #38bdf8; text-align: center; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; }
        input { padding: 8px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { padding: 8px 16px; background: #0ea5e9; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0284c7; }
        .block-card { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #38bdf8; }
        .block-header { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
        .hash { font-family: monospace; color: #94a3b8; word-break: break-all; font-size: 0.9em; }
        .tx-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .tx-table th, .tx-table td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
        .tx-table th { color: #94a3b8; }
        .status-success { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 VOIN Block Explorer</h1>
        
        <div class="header-bar">
            <div class="input-group">
                <input type="text" id="nodeUrl" value="http://127.0.0.1:5000" placeholder="Node URL">
                <button onclick="fetchChain()">Connect & Load Chain</button>
            </div>
            <div>
                <span>Status: </span><span id="status" style="color: #fbbf24;">Disconnected</span>
            </div>
        </div>

        <div id="chain-container">
            <!-- Blok akan dimuat di sini -->
            <p style="text-align: center; color: #64748b;">Tekan "Connect" untuk memuat data dari Node.</p>
        </div>
    </div>

    <script>
        async function fetchChain() {
            const nodeUrl = document.getElementById('nodeUrl').value;
            const statusEl = document.getElementById('status');
            const container = document.getElementById('chain-container');

            statusEl.innerText = "Connecting...";
            statusEl.style.color = "#fbbf24";

            try {
                const response = await fetch(`${nodeUrl}/sync`);
                if (!response.ok) throw new Error("Node unreachable");
                
                const data = await response.json();
                const chain = data.chain;

                statusEl.innerText = "Connected (Height: " + (chain.length - 1) + ")";
                statusEl.style.color = "#4ade80";

                // Render dari blok terbaru ke terlama
                container.innerHTML = "";
                for (let i = chain.length - 1; i >= 0; i--) {
                    const block = chain[i];
                    container.innerHTML += renderBlock(block);
                }
            } catch (error) {
                statusEl.innerText = "Connection Failed";
                statusEl.style.color = "#ef4444";
                container.innerHTML = `<p style="color: #ef4444; text-align: center;">Gagal terhubung ke Node di ${nodeUrl}. Pastikan node.py sedang berjalan.</p>`;
            }
        }

        function renderBlock(block) {
            let txHtml = "";
            if (block.transactions && block.transactions.length > 0) {
                txHtml = `
                    <table class="tx-table">
                        <thead>
                            <tr><th>Sender</th><th>Recipient</th><th>Amount</th><th>Nonce</th><th>Security</th></tr>
                        </thead>
                        <tbody>
                            ${block.transactions.map(tx => `
                                <tr>
                                    <td class="hash">${tx.sender}</td>
                                    <td class="hash">${tx.recipient}</td>
                                    <td style="color: #38bdf8; font-weight: bold;">${tx.amount} VOIN</td>
                                    <td>${tx.nonce}</td>
                                    <td class="status-success">ML-DSA Verified</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                txHtml = `<p style="color: #64748b; font-style: italic;">Tidak ada transaksi di blok ini.</p>`;
            }

            return `
                <div class="block-card">
                    <div class="block-header">
                        <h3>Block #${block.index} ${block.index === 0 ? '(Genesis)' : ''}</h3>
                        <span style="color: #94a3b8; font-size: 0.9em;">Validator: ${block.validator.substring(0,10)}...</span>
                    </div>
                    <p><strong>Block Hash:</strong> <span class="hash">${block.hash}</span></p>
                    <p><strong>Previous Hash:</strong> <span class="hash">${block.previous_hash}</span></p>
                    ${txHtml}
                </div>
            `;
        }
    </script>
</body>
</html>
