<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIN Coin - Presale Batch 1-10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-center py-10 px-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-400">VOIN COIN</h1>
            <p class="text-gray-400 text-sm mt-1">Presale Mainnet (Des 2026 - Des 2028)</p>
            <p id="connectionStatus" class="text-xs text-yellow-400 mt-2">Menghubungkan ke server...</p>
        </div>

        <!-- Indikator Batch -->
        <div class="bg-blue-900/50 border border-blue-500 rounded-lg p-3 text-center mb-6">
            <p class="text-sm text-blue-300">Saat ini masuk dalam:</p>
            <p class="text-xl font-bold text-white">BATCH <span id="currentBatch">1</span> / 10</p>
        </div>

        <!-- Statistik Kuota -->
        <div class="bg-gray-900 rounded-lg p-4 mb-6 space-y-2">
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Total Terjual:</span>
                <span id="tokensSold" class="font-bold text-green-400">Memuat...</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Sisa Kuota (Total):</span>
                <span id="tokensRemaining" class="font-bold text-yellow-400">Memuat...</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Sisa Kuota Batch Ini:</span>
                <span id="batchRemaining" class="font-bold text-purple-400">Memuat...</span>
            </div>
        </div>

        <!-- Form Pembelian -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Alamat Wallet VOIN Anda</label>
                <input type="text" id="walletAddress" placeholder="0x..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Jumlah Pembayaran (USDT/IDR)</label>
                <input type="number" id="amountPaid" min="0.01" step="any" placeholder="Contoh: 100" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
            </div>
            <button id="buyBtn" onclick="buyTokens()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                Beli VOIN
            </button>
        </div>
        
        <div class="mt-4 text-center">
            <p class="text-xs text-gray-500">Jadwal: Desember 2026 - Desember 2028</p>
        </div>
    </div>

    <script>
        // Ganti URL ini jika halaman dibuka dari GitHub Pages/domain lain
        // Jika dibuka langsung dari server Flask, window.location.origin akan dipakai otomatis
        const CONFIGURED_API_URL = ""; 
        const API_URL = (CONFIGURED_API_URL || window.location.origin).replace(/\/+$/, "");
        const MAX_PER_BATCH = 15600000;

        function setStatus(text, colorClass = "text-yellow-400") {
            const el = document.getElementById("connectionStatus");
            el.innerText = text;
            el.className = `text-xs mt-2 ${colorClass}`;
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/api/presale-stats`, {
                    method: "GET",
                    headers: { "Accept": "application/json" }
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();
                const currentBatch = Number(data.current_batch) || 1;
                const tokensSold = Number(data.tokens_sold) || 0;
                const tokensRemaining = Number(data.tokens_remaining) || 0;
                const soldInBatch = Number((data.batch_details && data.batch_details[currentBatch]) || 0);
                const remainingInBatch = Math.max(0, MAX_PER_BATCH - soldInBatch);

                document.getElementById("currentBatch").innerText = currentBatch;
                document.getElementById("tokensSold").innerText = tokensSold.toLocaleString("id-ID") + " VOIN";
                document.getElementById("tokensRemaining").innerText = tokensRemaining.toLocaleString("id-ID") + " VOIN";
                document.getElementById("batchRemaining").innerText = remainingInBatch.toLocaleString("id-ID") + " VOIN";

                setStatus("Terhubung ke server presale", "text-green-400");
            } catch (e) {
                console.error("Gagal konek ke server presale:", e);
                setStatus("Server presale belum terhubung", "text-red-400");
                document.getElementById("tokensSold").innerText = "-";
                document.getElementById("tokensRemaining").innerText = "-";
                document.getElementById("batchRemaining").innerText = "-";
            }
        }

        async function buyTokens() {
            const address = document.getElementById("walletAddress").value.trim();
            const amount = parseFloat(document.getElementById("amountPaid").value);
            const buyBtn = document.getElementById("buyBtn");

            if (!address || Number.isNaN(amount) || amount <= 0) {
                Swal.fire("Error", "Isi alamat wallet dan jumlah pembayaran yang valid!", "error");
                return;
            }

            buyBtn.disabled = true;
            Swal.fire({
                title: "Memproses...",
                text: "Menghubungi server presale",
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const response = await fetch(`${API_URL}/api/buy`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        wallet_address: address,
                        amount_paid: amount
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok && result.status === "success") {
                    Swal.fire("Berhasil!", result.message || "Pembelian berhasil dicatat.", "success");
                    document.getElementById("walletAddress").value = "";
                    document.getElementById("amountPaid").value = "";
                    await loadStats();
                } else {
                    const errMsg = result.reason || result.message || "Transaksi gagal diproses.";
                    Swal.fire("Gagal", errMsg, "error");
                }
            } catch (error) {
                console.error("Error saat membeli token:", error);
                Swal.fire("Error", "Tidak dapat terhubung ke server presale.", "error");
            } finally {
                buyBtn.disabled = false;
            }
        }

        loadStats();
    </script>
</body>
</html>
