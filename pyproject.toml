[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voin"
version = "0.1.0"
description = "VOIN Security Gateway"
requires-python = ">=3.13"
dependencies = [
    "eth-account>=0.13,<1.0",
    "dilithium-py>=1.1.0",
    "web3>=6.0.0",
    "solana>=0.30.0,<0.40",
    "solders>=0.18.0"
]

[dependency-groups]
dev = [
    "pytest-asyncio",
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0,<10.0",
]

[tool.setuptools]
py-modules = ["voin", "worker"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "security",
    "security.*",
    "wallet",
    "wallet.*",
]
exclude = [
    "tests",
    "tests.*",
]
